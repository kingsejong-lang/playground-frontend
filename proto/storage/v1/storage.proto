syntax = "proto3";

package playground.storage.v1;

option go_package = "github.com/kingsejong-lang/playground-backend/shared/proto/storage/v1;storagev1";

import "google/protobuf/timestamp.proto";

// StorageService manages code sharing and persistence
service StorageService {
  // CreateShare creates a shareable code snippet
  rpc CreateShare(CreateShareRequest) returns (Share);

  // GetShare retrieves a shared code snippet
  rpc GetShare(GetShareRequest) returns (Share);

  // DeleteShare deletes a shared code snippet
  rpc DeleteShare(DeleteShareRequest) returns (DeleteShareResponse);

  // SaveUserSettings saves user settings
  rpc SaveUserSettings(SaveSettingsRequest) returns (UserSettings);

  // GetUserSettings retrieves user settings
  rpc GetUserSettings(GetSettingsRequest) returns (UserSettings);
}

// CreateShareRequest represents a request to create a share
message CreateShareRequest {
  string language = 1;                    // Language ID
  map<string, string> files = 2;          // Source files
  string title = 3;                       // Share title (optional)
  string description = 4;                 // Share description (optional)
  int32 expires_in_days = 5;              // Expiration in days (default: 30)

  string user_id = 10;                    // User ID (optional)
}

// Share represents a shared code snippet
message Share {
  string id = 1;                          // Share ID (short URL-safe ID)
  string language = 2;                    // Language ID
  map<string, string> files = 3;          // Source files
  string title = 4;                       // Share title
  string description = 5;                 // Share description

  google.protobuf.Timestamp created_at = 10; // Creation time
  google.protobuf.Timestamp expires_at = 11; // Expiration time
  string user_id = 12;                    // Creator user ID
  int64 view_count = 13;                  // Number of views
}

// GetShareRequest represents a request to get a share
message GetShareRequest {
  string id = 1;                          // Share ID
}

// DeleteShareRequest represents a request to delete a share
message DeleteShareRequest {
  string id = 1;                          // Share ID
  string user_id = 2;                     // User ID (for authorization)
}

// DeleteShareResponse represents a response for delete operation
message DeleteShareResponse {
  bool deleted = 1;                       // Whether deletion succeeded
  string message = 2;                     // Response message
}

// SaveSettingsRequest represents a request to save user settings
message SaveSettingsRequest {
  string user_id = 1;                     // User ID
  UserSettings settings = 2;              // Settings to save
}

// UserSettings represents user preferences
message UserSettings {
  string user_id = 1;                     // User ID

  EditorSettings editor = 10;             // Editor settings
  ThemeSettings theme = 11;               // Theme settings
}

// EditorSettings represents editor preferences
message EditorSettings {
  int32 font_size = 1;                    // Font size
  string font_family = 2;                 // Font family
  int32 tab_size = 3;                     // Tab size
  bool auto_save = 4;                     // Auto-save enabled
  bool minimap = 5;                       // Minimap enabled
}

// ThemeSettings represents theme preferences
message ThemeSettings {
  string theme = 1;                       // Theme name (e.g., "dark", "light")
  string color_scheme = 2;                // Color scheme
}

// GetSettingsRequest represents a request to get user settings
message GetSettingsRequest {
  string user_id = 1;                     // User ID
}
