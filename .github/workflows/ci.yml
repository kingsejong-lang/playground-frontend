name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests with coverage thresholds
        run: npm run test:coverage
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=low

  e2e:
    # One job per browser, in parallel. Firefox and WebKit run only this
    # fake-backend suite; the real-stack suite stays on Chromium.
    name: End-to-end (fake backend, ${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install ${{ matrix.browser }}
        if: steps.pw-cache.outputs.cache-hit != 'true'
        # Chromium: the headless shell is enough and much smaller than the full browser.
        run: npx playwright install --with-deps ${{ matrix.browser == 'chromium' && '--only-shell' || '' }} ${{ matrix.browser }}
      - name: Install ${{ matrix.browser }} system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}
      # Starts `next dev` with NEXT_PUBLIC_RPC_FAKE=1 (playwright.config.ts); no backend is needed.
      - run: npm run test:e2e -- --project fake-${{ matrix.browser }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-fake-${{ matrix.browser }}
          path: |
            tests/e2e/report
            test-results
          retention-days: 7
